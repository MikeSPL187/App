<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Просмотр фото</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,300..800&amp;family=Roboto+Mono:wght@400;500&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;position:relative;overflow:hidden;background:#000000;color:#FFFFFF;font-family:'Roboto Flex',Roboto,system-ui,sans-serif">

  <svg width="390" height="520" viewBox="0 0 390 520" role="img" aria-label="Фото: закат над горным озером" style="position:absolute;left:0;top:150px;display:block">
    <rect width="390" height="200" fill="#E9B7A0"></rect>
    <rect y="200" width="390" height="140" fill="#F5D2A8"></rect>
    <circle cx="250" cy="236" r="34" fill="#FFE8BC"></circle>
    <path d="M0 290 L60 240 L120 270 L190 215 L260 262 L320 228 L390 258 L390 340 L0 340z" fill="#9C7FA8"></path>
    <path d="M0 322 L80 270 L150 302 L230 256 L300 298 L390 272 L390 342 L0 342z" fill="#5E4B73"></path>
    <rect y="340" width="390" height="180" fill="#6F86A8"></rect>
    <rect x="234" y="352" width="32" height="4" rx="2" fill="#FFE8BC" opacity="0.7"></rect>
    <rect x="240" y="368" width="20" height="4" rx="2" fill="#FFE8BC" opacity="0.55"></rect>
    <rect x="244" y="384" width="12" height="3" rx="1.5" fill="#FFE8BC" opacity="0.4"></rect>
    <path d="M0 470 Q120 440 220 468 T390 455 L390 520 L0 520z" fill="#2E3A40"></path>
  </svg>

  <header style="position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:2px;height:72px;padding:12px 4px 4px;box-sizing:border-box;background:rgba(0,0,0,0.55)">
    <a href="Media.dc.html" aria-label="Назад" style="width:48px;height:48px;border-radius:24px;display:flex;align-items:center;justify-content:center;flex:none">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ic.back}}"></path></svg>
    </a>
    <div style="flex:1;min-width:0;padding-left:4px">
      <div style="font-size:16px;line-height:22px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">IMG_20261021_1845.jpg</div>
      <div style="font-size:12.5px;line-height:17px;color:#D9DEDD">12 из 148 · 21 окт., 18:45</div>
    </div>
    <a href="PhotoInfo.dc.html" aria-label="Сведения о фото" style="width:48px;height:48px;border-radius:24px;display:flex;align-items:center;justify-content:center;flex:none">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ic.info}}"></path></svg>
    </a>
    <button aria-label="Ещё" style="width:48px;height:48px;border:0;border-radius:24px;background:transparent;display:flex;align-items:center;justify-content:center;padding:0;flex:none">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="{{ic.more}}"></path></svg>
    </button>
  </header>

  <span style="position:absolute;right:16px;top:684px;height:26px;padding:0 10px;border-radius:13px;background:rgba(0,0,0,0.55);font-size:12px;line-height:26px;font-weight:600;font-variant-numeric:tabular-nums">100%</span>

  <div style="position:absolute;left:0;right:0;bottom:0;padding:10px 0 18px;background:rgba(0,0,0,0.6);display:flex;flex-direction:column;gap:10px">
    <div role="list" aria-label="Соседние фото" style="display:flex;align-items:center;justify-content:center;gap:4px">
      <sc-for list="{{strip}}" as="s" hint-placeholder-count="9">
        <span role="listitem" aria-label="{{s.label}}" style="width:{{s.w}};height:44px;border-radius:8px;background:{{s.c}};box-sizing:border-box;border:{{s.ring}};flex:none"></span>
      </sc-for>
    </div>
    <div role="toolbar" aria-label="Действия с фото" style="display:flex;padding:0 8px">
      <sc-for list="{{acts}}" as="a" hint-placeholder-count="5">
        <button style="flex:1;height:60px;border:0;border-radius:18px;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:0;color:{{a.color}};font:inherit">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="{{a.color}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{a.icon}}"></path></svg>
          <span style="font-size:12px;line-height:16px;font-weight:600">{{a.label}}</span>
        </button>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const ic = {
      back:'M19 12H5 M11 6l-6 6 6 6',
      info:'M12 3a9 9 0 1 1 0 18a9 9 0 0 1 0-18z M12 11v5 M12 8h.01',
      more:'M12 5.5h.01 M12 12h.01 M12 18.5h.01'
    };
    const colors = ['#5E7C99', '#B98F7A', '#7B9C83', '#C9A35E', '#E9B7A0', '#8B7FB0', '#4F6B5A', '#A7B6C2', '#7D6A5B'];
    const strip = colors.map((c, i) => ({
      c, label: i === 4 ? 'Текущее фото' : 'Фото ' + (i + 8),
      w: i === 4 ? '56px' : '36px', ring: i === 4 ? '2px solid #FFFFFF' : '0'
    }));
    const acts = [
      { label:'Поделиться', color:'#FFFFFF', icon:'M18 3.5a2.5 2.5 0 1 1 0 5a2.5 2.5 0 0 1 0-5z M6 9.5a2.5 2.5 0 1 1 0 5a2.5 2.5 0 0 1 0-5z M18 15.5a2.5 2.5 0 1 1 0 5a2.5 2.5 0 0 1 0-5z M8.3 13.2l7.4 3.6 M15.7 7.2l-7.4 3.6' },
      { label:'Повернуть', color:'#FFFFFF', icon:'M4 12a8 8 0 1 0 2.4-5.7L4 8.6 M4 4v4.6h4.6' },
      { label:'Обои', color:'#FFFFFF', icon:'M8 3h8a1.5 1.5 0 0 1 1.5 1.5v15A1.5 1.5 0 0 1 16 21H8a1.5 1.5 0 0 1-1.5-1.5v-15A1.5 1.5 0 0 1 8 3z M6.5 15l3.5-3.5 3 3 1.5-1.5 2 2' },
      { label:'Слайд-шоу', color:'#FFFFFF', icon:'M4 5h16v12H4z M10 8.5v5l4-2.5z M9 20h6' },
      { label:'Удалить', color:'#FFB4AB', icon:'M4 7h16 M10 11v6 M14 11v6 M6 7l1 12.2A1 1 0 0 0 8 20h8a1 1 0 0 0 1-.8L18 7 M9 7V4.5h6V7' }
    ];
    return { ic, strip, acts };
  }
}
</script>
</body>
</html>
