  </sc-if>
</div>

    const navDef = [['Главная','home','Main.dc.html'],['Обзор','folder','Browser.dc.html'],['Сеть','cloud','Network.dc.html'],['Инструменты','tools','Cleaner.dc.html']];
    const nav = navDef.map(([label, i, href], idx) => {
      const a = idx === 1;
      return { label, href, icon:P[i], pill: a ? t.secC : 'transparent', color: a ? t.onSecC : t.onVar, weight: a ? 700 : 500 };
    });
    const actions = [
      { label:'Копировать', icon:P.copy, href:'Operations.dc.html', color:t.on },
      { label:'Переместить', icon:P.move, href:'Operations.dc.html', color:t.on },
      { label:'Поделиться', icon:P.share, href:'Selection.dc.html', color:t.on },
      { label:'В архив', icon:P.archive, href:'Operations.dc.html', color:t.on },
      { label:'Удалить', icon:P.trash, href:'Operations.dc.html', color:t.err }
    ];
    return { t, ic, fold, folders, files, nav, actions, select, browse: !select };
  }
}
