<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Обзор — тёмная тема</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,300..800&amp;family=Roboto+Mono:wght@400;500&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width:390px;height:844px;overflow:hidden;background:#0E1514;font-family:'Roboto Flex',Roboto,system-ui,sans-serif">
  <dc-import name="Browser" dark="{{ true }}" mode="{{mode}}" hint-size="390px,844px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["browse","select"],"default":"browse","section":"Состояние"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { mode: this.props.mode ?? 'browse' };
  }
}
</script>
</body>
</html>
