<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Текстовый редактор</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,300..800&amp;family=Roboto+Mono:wght@400;500&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;position:relative;overflow:hidden;display:flex;flex-direction:column;background:{{t.bg}};color:{{t.on}};font-family:'Roboto Flex',Roboto,system-ui,sans-serif">

  <header style="display:flex;align-items:center;gap:0;height:64px;padding:8px 4px 0;box-sizing:border-box;flex:none">
    <a href="Browser.dc.html" aria-label="Назад" style="width:48px;height:48px;border-radius:24px;display:flex;align-items:center;justify-content:center;flex:none">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="{{t.on}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5 M11 6l-6 6 6 6"></path></svg>
    </a>
    <div style="flex:1;min-width:0;padding-left:4px">
      <div style="display:flex;align-items:center;gap:6px">
        <h1 style="margin:0;font-size:19px;line-height:26px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">config.yaml</h1>
        <span role="img" aria-label="Есть несохранённые изменения" style="width:8px;height:8px;border-radius:4px;background:{{t.warn}};flex:none"></span>
      </div>
      <div style="font-size:12.5px;line-height:17px;color:{{t.onVar}};white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Память/Documents/Сервер</div>
    </div>
    <sc-for list="{{acts}}" as="a" hint-placeholder-count="3">
      <button aria-label="{{a.label}}" style="width:44px;height:48px;border:0;border-radius:22px;background:transparent;display:flex;align-items:center;justify-content:center;padding:0;flex:none">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{a.color}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{a.icon}}"></path></svg>
      </button>
    </sc-for>
    <button style="height:40px;padding:0 14px;margin:0 4px 0 2px;border:0;border-radius:20px;background:{{t.pri}};color:{{t.onPri}};font:inherit;font-size:14px;font-weight:650;flex:none">Сохранить</button>
  </header>

  <section aria-label="Поиск и замена" style="margin:6px 12px 0;padding:8px;border-radius:20px;background:{{t.cont}};display:flex;flex-direction:column;gap:6px;flex:none">
    <div style="display:flex;align-items:center;gap:4px">
      <label style="flex:1;display:flex;align-items:center;gap:8px;height:40px;padding:0 10px;border-radius:12px;background:{{t.field}};border:2px solid {{t.pri}};box-sizing:border-box">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{t.onVar}}" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M11 4a7 7 0 1 0 0 14a7 7 0 1 0 0-14z M20 20l-4.3-4.3"></path></svg>
        <input type="text" value="name" aria-label="Найти" style="flex:1;min-width:0;border:0;background:transparent;font-family:'Roboto Mono',monospace;font-size:14px;color:{{t.on}};outline:none">
        <span style="font-size:12.5px;color:{{t.onVar}};white-space:nowrap">1 из 2</span>
      </label>
      <button aria-label="Предыдущее совпадение" style="width:40px;height:40px;border:0;border-radius:20px;background:transparent;display:flex;align-items:center;justify-content:center;padding:0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{t.on}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15l6-6 6 6"></path></svg></button>
      <button aria-label="Следующее совпадение" style="width:40px;height:40px;border:0;border-radius:20px;background:transparent;display:flex;align-items:center;justify-content:center;padding:0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{t.on}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button>
      <button aria-label="Учитывать регистр" aria-pressed="false" style="width:40px;height:40px;border:0;border-radius:12px;background:transparent;color:{{t.onVar}};font-family:'Roboto Mono',monospace;font-size:13px;font-weight:500;padding:0">Aa</button>
    </div>
    <div style="display:flex;align-items:center;gap:6px">
      <label style="flex:1;display:flex;align-items:center;gap:8px;height:40px;padding:0 10px;border-radius:12px;background:{{t.field}};border:1px solid {{t.outlineVar}};box-sizing:border-box">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{t.onVar}}" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h12l-3-3 M20 16H8l3 3"></path></svg>
        <input type="text" value="login" aria-label="Заменить на" style="flex:1;min-width:0;border:0;background:transparent;font-family:'Roboto Mono',monospace;font-size:14px;color:{{t.on}};outline:none">
      </label>
      <button style="height:40px;padding:0 12px;border:1px solid {{t.outline}};border-radius:20px;background:transparent;color:{{t.pri}};font:inherit;font-size:13px;font-weight:650">Заменить</button>
      <button style="height:40px;padding:0 12px;border:0;border-radius:20px;background:{{t.secC}};color:{{t.onSecC}};font:inherit;font-size:13px;font-weight:650">Все</button>
    </div>
  </section>

  <div role="textbox" aria-multiline="true" aria-label="Содержимое файла" style="flex:1;min-height:0;overflow:hidden;padding:10px 0 0;font-family:'Roboto Mono',monospace;font-size:13.5px;line-height:22px">
    <sc-for list="{{lines}}" as="l" hint-placeholder-count="17">
      <div style="display:flex;background:{{l.bg}}">
        <span aria-hidden="true" style="width:40px;flex:none;text-align:right;padding-right:12px;color:{{l.numColor}};font-size:12px;user-select:none">{{l.n}}</span>
        <span style="white-space:pre;flex:1;min-width:0;overflow:hidden"><sc-for list="{{l.parts}}" as="p" hint-placeholder-count="3"><span style="color:{{p.c}};font-style:{{p.fs}};background:{{p.bg}};border-radius:3px">{{p.s}}</span></sc-for><sc-if value="{{l.cursor}}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="display:inline-block;width:2px;height:18px;vertical-align:-4px;background:{{t.pri}}"></span></sc-if></span>
      </div>
    </sc-for>
  </div>

  <div style="flex:none;border-top:1px solid {{t.line}};background:{{t.cont}}">
    <div style="display:flex;justify-content:space-between;padding:6px 16px;font-size:12px;line-height:16px;color:{{t.onVar}};font-variant-numeric:tabular-nums">
      <span>Стр 14, кол 9</span><span>YAML · UTF-8 · LF</span>
    </div>
    <div role="toolbar" aria-label="Символы" style="display:flex;gap:4px;padding:2px 8px 12px;overflow:hidden">
      <sc-for list="{{keys}}" as="k" hint-placeholder-count="10">
        <button style="min-width:40px;height:40px;padding:0 8px;border:0;border-radius:12px;background:{{t.field}};color:{{t.on}};font-family:'Roboto Mono',monospace;font-size:14px;font-weight:500;flex:none">{{k}}</button>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false,"section":"Тема"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const d = !!this.props.dark;
    const t = d ? {
      bg:'#0E1514', cont:'#1A2120', field:'#252B2A', line:'#2A3231', on:'#DDE4E2', onVar:'#BEC9C7', outline:'#899391', outlineVar:'#3F4948',
      pri:'#7FD6CD', onPri:'#003734', secC:'#324B48', onSecC:'#CCE8E4', warn:'#FFB95C',
      key:'#7FD6CD', str:'#FFCF83', num:'#D2C2FF', com:'#9AA5A3', hl:'#6B4E00', hlCur:'#8A6400', curLine:'#1A2A28', num2:'#6F7978'
    } : {
      bg:'#FFFFFF', cont:'#F5F9F8', field:'#FFFFFF', line:'#E3EAE8', on:'#161D1C', onVar:'#3F4948', outline:'#6F7978', outlineVar:'#BEC9C7',
      pri:'#006A64', onPri:'#FFFFFF', secC:'#CCE8E4', onSecC:'#051F1D', warn:'#C98A00',
      key:'#006A64', str:'#8A5300', num:'#5B3FB8', com:'#5E6A68', hl:'#FFE9A8', hlCur:'#FFD24D', curLine:'#EFF7F5', num2:'#6F7978'
    };
    const acts = [
      { label:'Отменить', color:t.on, icon:'M9 14L4 9l5-5 M4 9h10.5a5.5 5.5 0 0 1 0 11H11' },
      { label:'Повторить', color:t.onVar, icon:'M15 14l5-5-5-5 M20 9H9.5a5.5 5.5 0 0 0 0 11H13' },
      { label:'Параметры файла', color:t.onVar, icon:'M4 7h9 M17 7h3 M15 5v4 M4 12h3 M11 12h9 M9 10v4 M4 17h11 M19 17h1 M17 15v4' }
    ];
    const C = { k:t.key, s:t.str, n:t.num, c:t.com, p:t.on };
    const src = [
      [['c', '# Домашний сервер']],
      [['k', 'server'], ['p', ':']],
      [['p', '  '], ['k', 'host'], ['p', ': '], ['n', '192.168.1.50']],
      [['p', '  '], ['k', 'port'], ['p', ': '], ['n', '8080']],
      [['p', '  '], ['k', 'tls'], ['p', ': '], ['n', 'true']],
      [],
      [['k', 'storage'], ['p', ':']],
      [['p', '  '], ['k', 'path'], ['p', ': '], ['s', '"/mnt/nas/media"']],
      [['p', '  '], ['k', 'max_size'], ['p', ': '], ['n', '2TB']],
      [['p', '  '], ['c', '# TODO: включить сжатие']],
      [['p', '  '], ['k', 'compress'], ['p', ': '], ['n', 'false']],
      [],
      [['k', 'users'], ['p', ':']],
      [['p', '  - '], ['k', 'name', 'cur'], ['p', ': '], ['s', '"ivan"']],
      [['p', '    '], ['k', 'role'], ['p', ': '], ['s', 'admin']],
      [['p', '  - '], ['k', 'name', 'hit'], ['p', ': '], ['s', '"guest"']],
      [['p', '    '], ['k', 'role'], ['p', ': '], ['s', 'read-only']]
    ];
    const lines = src.map((parts, i) => {
      const cur = i === 13;
      return {
        n: String(i + 1), bg: cur ? t.curLine : 'transparent', numColor: cur ? t.pri : t.num2, cursor: cur,
        parts: parts.map(([k, s, m]) => ({
          s, c: C[k], fs: k === 'c' ? 'italic' : 'normal',
          bg: m === 'cur' ? t.hlCur : m === 'hit' ? t.hl : 'transparent'
        }))
      };
    });
    const keys = ['Tab', '←', '→', ':', '-', '"', '#', '{', '}', '[', ']'];
    return { t, acts, lines, keys };
  }
}
</script>
</body>
</html>
