<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Очередь воспроизведения</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,300..800&amp;family=Roboto+Mono:wght@400;500&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;position:relative;overflow:hidden;display:flex;flex-direction:column;background:{{t.bg}};color:{{t.on}};font-family:'Roboto Flex',Roboto,system-ui,sans-serif">

  <header style="display:flex;align-items:center;gap:2px;height:64px;padding:8px 4px 0;box-sizing:border-box;flex:none">
    <a href="Browser.dc.html" aria-label="Назад" style="width:48px;height:48px;border-radius:24px;display:flex;align-items:center;justify-content:center;flex:none">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="{{t.on}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5 M11 6l-6 6 6 6"></path></svg>
    </a>
    <div style="flex:1;padding-left:4px">
      <h1 style="margin:0;font-size:22px;line-height:28px;font-weight:650">Очередь</h1>
      <div style="font-size:13px;line-height:18px;color:{{t.onVar}}">8 треков · 1 ч 12 мин · из папки «Музыка»</div>
    </div>
    <button aria-label="Перемешать" style="width:48px;height:48px;border:0;border-radius:24px;background:transparent;display:flex;align-items:center;justify-content:center;padding:0;flex:none">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="{{t.onVar}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h3.5l9 10H20 M4 17h3.5l2.5-2.8 M14 9.8L16.5 7H20 M17.5 4.5L20 7l-2.5 2.5 M17.5 14.5L20 17l-2.5 2.5"></path></svg>
    </button>
    <button aria-label="Ещё" style="width:48px;height:48px;border:0;border-radius:24px;background:transparent;display:flex;align-items:center;justify-content:center;padding:0;flex:none">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="{{t.onVar}}" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5.5h.01 M12 12h.01 M12 18.5h.01"></path></svg>
    </button>
  </header>

  <div role="list" style="flex:1;min-height:0;overflow:hidden;padding:4px 8px 0">
    <sc-for list="{{tracks}}" as="r" hint-placeholder-count="8">
      <div role="listitem" style="display:flex;align-items:center;gap:14px;height:64px;padding:0 4px 0 12px;border-radius:16px;background:{{r.rowBg}};margin-bottom:2px;opacity:{{r.op}}">
        <span style="width:40px;height:40px;border-radius:12px;background:{{r.tileBg}};display:flex;align-items:center;justify-content:center;flex:none">
          <sc-if value="{{r.now}}" hint-placeholder-val="{{ false }}">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="{{t.onPri}}" aria-label="Играет"><rect x="5" y="9" width="3" height="10" rx="1.5"></rect><rect x="10.5" y="5" width="3" height="14" rx="1.5"></rect><rect x="16" y="11" width="3" height="8" rx="1.5"></rect></svg>
          </sc-if>
          <sc-if value="{{r.notNow}}" hint-placeholder-val="{{ true }}">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{t.audioFg}}" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 17.5V6l10-2v11.5 M9 17.5a2.5 2.5 0 1 1-5 0a2.5 2.5 0 0 1 5 0z M19 15.5a2.5 2.5 0 1 1-5 0a2.5 2.5 0 0 1 5 0z"></path></svg>
          </sc-if>
        </span>
        <div style="flex:1;min-width:0">
          <div style="font-size:15.5px;line-height:22px;font-weight:{{r.weight}};white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:{{r.color}}">{{r.name}}</div>
          <div style="font-size:13px;line-height:18px;color:{{t.onVar}}">{{r.meta}}</div>
        </div>
        <span style="font-size:13px;color:{{t.onVar}};font-variant-numeric:tabular-nums">{{r.dur}}</span>
        <button aria-label="Перетащить, чтобы изменить порядок" style="width:44px;height:44px;border:0;border-radius:22px;background:transparent;display:flex;align-items:center;justify-content:center;padding:0;flex:none">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{t.outline}}" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 9h14 M5 15h14"></path></svg>
        </button>
      </div>
    </sc-for>
  </div>

  <a href="MusicPlayer.dc.html" aria-label="Открыть плеер" style="margin:8px 12px 16px;position:relative;display:flex;align-items:center;gap:12px;height:72px;padding:0 8px 0 10px;border-radius:24px;background:{{t.bar}};box-shadow:0 6px 20px {{t.shadow}};text-decoration:none;color:{{t.on}};overflow:hidden;flex:none">
    <svg width="52" height="52" viewBox="0 0 326 326" aria-hidden="true" style="border-radius:14px;flex:none">
      <rect width="326" height="326" fill="#0F3D3A"></rect>
      <circle cx="163" cy="150" r="88" fill="none" stroke="#7FD6CD" stroke-width="8" opacity="0.4"></circle>
      <circle cx="163" cy="150" r="58" fill="#F2B84B"></circle>
      <rect y="178" width="326" height="148" fill="#0A2E2C"></rect>
    </svg>
    <span style="flex:1;min-width:0;display:flex;flex-direction:column">
      <span style="font-size:15px;line-height:20px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Утро_live</span>
      <span style="font-size:12.5px;line-height:17px;color:{{t.onVar}};font-variant-numeric:tabular-nums">1:42 / 4:18</span>
    </span>
    <span style="width:48px;height:48px;border-radius:16px;background:{{t.priC}};display:flex;align-items:center;justify-content:center;flex:none">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="{{t.onPriC}}" aria-label="Пауза"><rect x="6" y="5" width="4.2" height="14" rx="1.2"></rect><rect x="13.8" y="5" width="4.2" height="14" rx="1.2"></rect></svg>
    </span>
    <span style="width:44px;height:48px;display:flex;align-items:center;justify-content:center;flex:none">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="{{t.on}}" stroke="{{t.on}}" stroke-width="1.6" stroke-linejoin="round" aria-label="Следующий"><path d="M6 6l9 6-9 6z M18 6v12"></path></svg>
    </span>
    <span aria-hidden="true" style="position:absolute;left:0;right:0;bottom:0;height:3px;background:{{t.track}}"><span style="display:block;width:40%;height:3px;background:{{t.pri}}"></span></span>
  </a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false,"section":"Тема"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const d = !!this.props.dark;
    const t = d ? {
      bg:'#0E1514', bar:'#252B2A', track:'#3F4948', on:'#DDE4E2', onVar:'#BEC9C7', outline:'#899391',
      pri:'#7FD6CD', onPri:'#003734', priC:'#00504B', onPriC:'#9DF2E9', secC:'#324B48', onSecC:'#CCE8E4',
      audioBg:'#4D3300', audioFg:'#FFCF83', shadow:'rgba(0,0,0,0.45)'
    } : {
      bg:'#F5F9F8', bar:'#FFFFFF', track:'#DCE5E3', on:'#161D1C', onVar:'#3F4948', outline:'#6F7978',
      pri:'#006A64', onPri:'#FFFFFF', priC:'#9DF2E9', onPriC:'#00201E', secC:'#CCE8E4', onSecC:'#051F1D',
      audioBg:'#FFE2B8', audioFg:'#6B4300', shadow:'rgba(22,29,28,0.16)'
    };
    const raw = [
      ['Демо_v3.wav', 'WAV · 48 МБ', '3:12', 'played'],
      ['Утро_live.flac', 'FLAC · 31 МБ', '4:18', 'now'],
      ['Тема_для_звонка.ogg', 'OGG · 1,2 МБ', '0:32'],
      ['Ночной_поезд.mp3', 'MP3 · 8,7 МБ', '3:47'],
      ['Подкаст_ep41.mp3', 'MP3 · 53,2 МБ', '52:10'],
      ['Голосовое_0412.m4a', 'M4A · 812 КБ', '1:05'],
      ['Сэмпл_гитара.wav', 'WAV · 8,1 МБ', '0:48'],
      ['Дождь_на_даче.flac', 'FLAC · 44 МБ', '6:20']
    ];
    const tracks = raw.map(([name, meta, dur, st]) => {
      const now = st === 'now';
      return {
        name, meta, dur, now, notNow: !now,
        op: st === 'played' ? 0.6 : 1,
        rowBg: now ? t.secC : 'transparent',
        tileBg: now ? t.pri : t.audioBg,
        weight: now ? 700 : 550,
        color: now ? t.onSecC : t.on
      };
    });
    return { t, tracks };
  }
}
</script>
</body>
</html>
