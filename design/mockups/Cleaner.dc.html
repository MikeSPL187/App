<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Инструменты и очистка</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,300..800&amp;family=Roboto+Mono:wght@400;500&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;position:relative;overflow:hidden;display:flex;flex-direction:column;background:{{t.bg}};color:{{t.on}};font-family:'Roboto Flex',Roboto,system-ui,sans-serif">

  <header style="display:flex;align-items:center;height:64px;padding:8px 8px 0 20px;box-sizing:border-box;flex:none">
    <h1 style="margin:0;flex:1;font-size:26px;line-height:32px;font-weight:650;letter-spacing:-0.3px">Инструменты</h1>
    <button aria-label="История очистки" style="width:48px;height:48px;border:0;border-radius:24px;background:transparent;display:flex;align-items:center;justify-content:center;padding:0">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="{{t.onVar}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ic.history}}"></path></svg>
    </button>
  </header>

  <section aria-label="Состояние памяти" style="margin:8px 16px 0;padding:16px;border-radius:28px;background:{{t.card}};border:1px solid {{t.line}};display:flex;gap:16px;align-items:center;flex:none">
    <div style="position:relative;width:112px;height:112px;flex:none">
      <svg width="112" height="112" viewBox="0 0 112 112" role="img" aria-label="Занято 67 процентов, из них 3,2 гигабайта можно освободить">
        <circle cx="56" cy="56" r="48" fill="none" stroke="{{t.track}}" stroke-width="12"></circle>
        <circle cx="56" cy="56" r="48" fill="none" stroke="{{t.pri}}" stroke-width="12" stroke-linecap="round" stroke-dasharray="190 301.6" transform="rotate(-90 56 56)"></circle>
        <circle cx="56" cy="56" r="48" fill="none" stroke="{{t.warn}}" stroke-width="12" stroke-linecap="round" stroke-dasharray="7.5 301.6" stroke-dashoffset="-198" transform="rotate(-90 56 56)"></circle>
      </svg>
      <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center">
        <span style="font-size:24px;line-height:28px;font-weight:700;letter-spacing:-0.3px">67%</span>
        <span style="font-size:12px;line-height:16px;color:{{t.onVar}}">занято</span>
      </div>
    </div>
    <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px">
      <span style="font-size:13px;line-height:18px;color:{{t.onVar}}">Можно освободить</span>
      <span style="font-size:30px;line-height:36px;font-weight:700;letter-spacing:-0.5px;color:{{t.pri}}">3,2 ГБ</span>
      <span style="font-size:12.5px;line-height:16px;color:{{t.onVar}}">Без риска: копии, кэш, старая корзина и установленные APK</span>
      <button style="margin-top:10px;height:40px;border:0;border-radius:20px;background:{{t.pri}};color:{{t.onPri}};font:inherit;font-size:14px;font-weight:650;display:flex;align-items:center;justify-content:center;gap:8px">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{t.onPri}}" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ic.sparkle}}"></path></svg>
        Очистить выбранное
      </button>
    </div>
  </section>

  <h2 style="margin:0;padding:18px 20px 8px;font-size:16px;line-height:24px;font-weight:650;flex:none">Рекомендации</h2>
  <div style="margin:0 16px;display:flex;flex-direction:column;gap:2px;border-radius:24px;overflow:hidden;flex:none">
    <sc-for list="{{recs}}" as="r" hint-placeholder-count="5">
      <label style="display:flex;align-items:center;gap:12px;height:60px;padding:0 12px 0 14px;background:{{t.card}}">
        <input type="checkbox" checked="{{r.on}}" aria-label="{{r.title}}" style="width:20px;height:20px;margin:0;accent-color:{{t.pri}};flex:none">
        <span style="width:36px;height:36px;border-radius:11px;background:{{r.bg}};display:flex;align-items:center;justify-content:center;flex:none">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{r.fg}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{r.icon}}"></path></svg>
        </span>
        <span style="flex:1;min-width:0;display:flex;flex-direction:column">
          <span style="font-size:15px;line-height:20px;font-weight:600">{{r.title}}</span>
          <span style="font-size:12.5px;line-height:16px;color:{{t.onVar}};white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{r.sub}}</span>
        </span>
        <span style="font-size:14px;font-weight:650;font-variant-numeric:tabular-nums;color:{{r.sizeColor}}">{{r.size}}</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{t.outline}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ic.chevR}}"></path></svg>
      </label>
    </sc-for>
  </div>

  <h2 style="margin:0;padding:18px 20px 8px;font-size:16px;line-height:24px;font-weight:650;flex:none">Ещё инструменты</h2>
  <div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;padding:0 16px;flex:none">
    <sc-for list="{{tools}}" as="x" hint-placeholder-count="4">
      <a href="{{x.href}}" style="display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px 10px;border-radius:20px;background:{{t.card}};text-decoration:none;color:{{t.on}}">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="{{t.pri}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{x.icon}}"></path></svg>
        <span style="font-size:12px;line-height:15px;font-weight:600;text-align:center">{{x.label}}</span>
      </a>
    </sc-for>
  </div>

  <div style="flex:1"></div>
  <nav aria-label="Основная навигация" style="height:80px;flex:none;display:flex;background:{{t.cont}};padding:12px 0 16px;box-sizing:border-box">
    <sc-for list="{{nav}}" as="n" hint-placeholder-count="4">
      <a href="{{n.href}}" style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;text-decoration:none">
        <span style="width:64px;height:32px;border-radius:16px;background:{{n.pill}};display:flex;align-items:center;justify-content:center">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="{{n.color}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{n.icon}}"></path></svg>
        </span>
        <span style="font-size:12px;line-height:16px;font-weight:{{n.weight}};color:{{n.color}}">{{n.label}}</span>
      </a>
    </sc-for>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false,"section":"Тема"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const d = !!this.props.dark;
    const t = d ? {
      bg:'#0E1514', cont:'#1A2120', card:'#1A2120', line:'#2A3231', track:'#2F3635',
      on:'#DDE4E2', onVar:'#BEC9C7', outline:'#899391', pri:'#7FD6CD', onPri:'#003734',
      secC:'#324B48', onSecC:'#CCE8E4', warn:'#FFB95C'
    } : {
      bg:'#F5F9F8', cont:'#E9EFEE', card:'#FFFFFF', line:'#DCE5E3', track:'#E3EAE8',
      on:'#161D1C', onVar:'#3F4948', outline:'#6F7978', pri:'#006A64', onPri:'#FFFFFF',
      secC:'#CCE8E4', onSecC:'#051F1D', warn:'#C98A00'
    };
    const ic = {
      history:'M4 12a8 8 0 1 0 2.4-5.7L4 8.6 M4 4v4.6h4.6 M12 8v4.5l3 1.8',
      sparkle:'M12 4l1.6 4.4L18 10l-4.4 1.6L12 16l-1.6-4.4L6 10l4.4-1.6z M18.5 15.5l.7 1.8 1.8.7-1.8.7-.7 1.8-.7-1.8-1.8-.7 1.8-.7z',
      chevR:'M9 6l6 6-6 6'
    };
    const P = {
      copy:'M9 9h10a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H10a1 1 0 0 1-1-1z M5.5 15H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h9a1 1 0 0 1 1 1v.5',
      big:'M4 20h16 M7 16V9 M12 16V4 M17 16v-5',
      apk:'M12 3l8 4.5v9L12 21l-8-4.5v-9z M4.3 7.6L12 12l7.7-4.4 M12 12v9',
      cache:'M12 4c4.4 0 8 1.3 8 3s-3.6 3-8 3-8-1.3-8-3 3.6-3 8-3z M4 7v10c0 1.7 3.6 3 8 3s8-1.3 8-3V7 M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3',
      trash:'M4 7h16 M10 11v6 M14 11v6 M6 7l1 12.2A1 1 0 0 0 8 20h8a1 1 0 0 0 1-.8L18 7 M9 7V4.5h6V7',
      laptop:'M5 6a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v9H5z M3 19h18 M5 15l-2 4 M19 15l2 4',
      grid:'M4 4h6.5v6.5H4z M13.5 4H20v6.5h-6.5z M4 13.5h6.5V20H4z M13.5 13.5H20V20h-6.5z',
      pie:'M12 3v9h9 M20.5 15A9 9 0 1 1 9 3.5',
      home:'M4 10.5L12 4l8 6.5 M6 9v10.5h4.5V14h3v5.5H18V9',
      folder:'M3.5 7.5a2 2 0 0 1 2-2h3.8l2 2h7.2a2 2 0 0 1 2 2v7.5a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z',
      cloud:'M7.5 18.5a4.5 4.5 0 0 1-.4-9A6 6 0 0 1 18.3 10a4.3 4.3 0 0 1-.8 8.5z',
      tools:'M14.5 5.5a4 4 0 0 0-5 5L4.5 15.5a2.1 2.1 0 0 0 3 3l5-5a4 4 0 0 0 5-5l-2.4 2.4-2.6-.4-.4-2.6z'
    };
    const C = d ? {
      photo:['#3A2A6B','#D2C2FF'], video:['#5C1A16','#FFB4A9'], apk:['#233A0B','#B0D58E'], docs:['#1F3266','#B3C5FF'], other:['#2F3635','#BEC9C7']
    } : {
      photo:['#E9DDFF','#4A2C9E'], video:['#FFDAD4','#8C1D18'], apk:['#D5F0B9','#2C5000'], docs:['#D8E2FF','#1B3D8F'], other:['#E3EAE8','#3F4948']
    };
    const recs = [
      { title:'Дубликаты', sub:'48 копий в 12 группах · оригиналы останутся', size:'1,6 ГБ', icon:P.copy, k:'photo', on:true },
      { title:'Большие файлы', sub:'Больше 500 МБ · 4 файла · проверьте вручную', size:'2,8 ГБ', icon:P.big, k:'video', on:false },
      { title:'Установленные APK', sub:'Приложения уже стоят · 6 файлов', size:'640 МБ', icon:P.apk, k:'apk', on:true },
      { title:'Кэш приложений', sub:'23 приложения · восстановится сам', size:'610 МБ', icon:P.cache, k:'docs', on:true },
      { title:'Корзина', sub:'Старше 30 дней · 14 файлов', size:'350 МБ', icon:P.trash, k:'other', on:true }
    ].map((r) => Object.assign({}, r, { bg: C[r.k][0], fg: C[r.k][1], sizeColor: r.on ? t.on : t.onVar }));
    const tools = [
      { label:'Доступ с ПК', icon:P.laptop, href:'Network.dc.html' },
      { label:'Корзина', icon:P.trash, href:'Browser.dc.html' },
      { label:'Приложения', icon:P.grid, href:'Browser.dc.html' },
      { label:'Анализ папок', icon:P.pie, href:'Browser.dc.html' }
    ];
    const navDef = [['Главная','home','Main.dc.html'],['Обзор','folder','Browser.dc.html'],['Сеть','cloud','Network.dc.html'],['Инструменты','tools','Cleaner.dc.html']];
    const nav = navDef.map(([label, i, href], idx) => {
      const a = idx === 3;
      return { label, href, icon:P[i], pill: a ? t.secC : 'transparent', color: a ? t.onSecC : t.onVar, weight: a ? 700 : 500 };
    });
    return { t, ic, recs, tools, nav };
  }
}
</script>
</body>
</html>
