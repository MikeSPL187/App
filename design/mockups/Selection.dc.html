<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Режим выбора</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,300..800&amp;family=Roboto+Mono:wght@400;500&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width:390px;height:844px;overflow:hidden;font-family:'Roboto Flex',Roboto,system-ui,sans-serif">
  <dc-import name="Browser" mode="select" dark="{{dark}}" hint-size="390px,844px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false,"section":"Тема"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { dark: !!this.props.dark };
  }
}
</script>
</body>
</html>
